<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Goat Music Theory</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div id="app">
    <div id="home-screen" class="screen">
      <canvas id="map-canvas"></canvas>

      <div id="dialogue-box" class="dialogue-box"></div>

      <div id="hint-text" class="hint-text">Use arrow keys to explore. Click on nodes to learn!</div>

      <div class="volume-control">
        <button id="mute-button" class="hud-button" aria-label="Mute">
          <img src="assets/images/icons/unmute.svg" alt="" id="mute-icon">
        </button>
        <input type="range" id="volume-slider" class="volume-slider" min="0" max="100" value="80" aria-label="Volume">
      </div>

            <div id="interact-prompt" class="interact-prompt hidden">Press SPACE to explore</div>

      <div id="popup-overlay" class="popup-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="popup-title">
        <div class="popup-panel">
          <button id="popup-close" class="popup-close" aria-label="Back to map">&larr;</button>
          <h2 id="popup-title" class="visually-hidden"></h2>

          <div class="popup-sidebar">
            <button class="popup-tab" data-section="toy">Toy</button>
            <button class="popup-tab" data-section="definition">Definition</button>
            <button class="popup-tab" data-section="notation">Notation</button>
            <button class="popup-tab" data-section="instrument">Instrument</button>
            <button class="popup-tab" data-section="quiz">Quiz</button>
          </div>

          <div class="popup-content">
            <div class="popup-panel-body" data-section="toy">Coming in Layer 10</div>
            <div class="popup-panel-body" data-section="definition" id="popup-definition">Coming in Layer 7</div>
            <div class="popup-panel-body" data-section="notation" id="notation-canvas">Coming in Layer 8</div>
            <div class="popup-panel-body" data-section="instrument" id="instrument-container">Coming in Layer 9</div>
            <div class="popup-panel-body" data-section="quiz">Coming in Layer 11</div>
          </div>
        </div>
      </div>



    </div>
  </div>

  <div id="start-gate" class="start-gate">
    <div class="start-gate-panel">
        <h1>Goat Music Theory</h1>
        <p>Tap or press any key to begin</p>
    </div>
  </div>

  <script src="js/vendor/tone.min.js"></script>
  <script src="js/vendor/vexflow.min.js"></script>
  <script type="module" src="js/main.js"></script>

</body>
</html>
